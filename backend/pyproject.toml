[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nxtrep-backend"
version = "0.1.0"
description = "NxtRep FastAPI and LangChain backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "alibabacloud-oss-v2>=1.3,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "fonttools>=4.59,<5",
  "langchain>=1.0,<2",
  "langchain-deepseek>=1.1,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pgvector>=0.3,<1",
  "pillow>=12.3,<13",
  "pwdlib[argon2]>=0.3.1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.13.0",
  "pypdf>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tiktoken>=0.12,<1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nxtrep_backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
